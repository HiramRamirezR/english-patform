<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Moonsforest</title>
    <meta name="description" content="Página no encontrada en Moonsforest.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-deep: #052e16;
            --forest-mid: #14532d;
            --forest-light: #166534;
            --forest-glow: #22c55e;
            --moon: #e2e8f0;
            --slate-700: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #052e16 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        .starfield {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }
        .moon { font-size: 5rem; margin-bottom: 1rem; }
        h1 { font-size: 6rem; font-weight: 800; background: linear-gradient(135deg, #22c55e, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        p { font-size: 1.2rem; color: rgba(255,255,255,0.6); margin: 1rem 0 2rem; max-width: 400px; }
        a {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        a:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="starfield" id="starfield"></div>
    <div class="container">
        <div class="moon">🐻‍❄️</div>
        <h1>404</h1>
        <p>Moon no encontró esta página. Parece que te perdiste en el bosque...</p>
        <a href="/mapa.html">🌲 Volver al mapa</a>
    </div>
    <script>
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 0.5;
            star.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*5}s;animation-duration:${2+Math.random()*3}s;opacity:${Math.random()*0.5+0.1}`;
            starfield.appendChild(star);
        }
    </script>
</body>
</html>
