<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo | Moonsforest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mapa.css">
</head>

<body>
    <!-- Header Modular -->
    <div id="main-header"></div>

    <!-- Skeleton Loader -->
    <div class="dashboard-container" id="skeleton-loader" style="padding: 2rem 1rem; overflow: visible;">
        <div style="max-width: 800px; margin: 0 auto;">
            <header class="stats-header" style="justify-content: space-between; gap: 1rem; margin-bottom: 2rem;">
                <div class="skeleton" style="width:80px; height:36px; border-radius:99px;"></div>
                <div class="skeleton skeleton-title" style="width:200px; height:24px; margin:0;"></div>
                <div style="width:80px;"></div>
            </header>
            <div style="display:flex; flex-direction:column; align-items:center; gap:0.75rem; margin-top:3rem;">
                <div class="skeleton skeleton-node"></div>
                <div class="skeleton skeleton-node"></div>
                <div class="skeleton skeleton-node"></div>
                <div class="skeleton skeleton-node"></div>
                <div class="skeleton skeleton-node"></div>
            </div>
        </div>
    </div>

    <div class="dashboard-container" id="dashboard-content" style="padding: 2rem 1rem; overflow: visible; display:none;">
        <div style="max-width: 800px; margin: 0 auto;">

            <header class="stats-header"
                style="justify-content: space-between; gap: 1rem; margin-bottom: 2rem; position: relative; top: 0;">
                <button class="btn btn-secondary" onclick="window.location.href='mapa.html'"
                    style="padding: 0.5rem 1rem; font-size: 0.9rem; background: rgba(30, 41, 59, 0.95); border: 1px solid #334155; color: #f8fafc;">←
                    Volver</button>
                <h2 style="font-size: 1.25rem; color: #38bdf8; margin: 0; flex: 1; text-align: center;"
                    id="module-title">Cargando Módulo...</h2>
                <div style="width: 80px;"></div> <!-- Spacing balance -->
            </header>

            <p style="text-align: center; color: #cbd5e1; margin-bottom: 0.5rem;" id="module-desc">Por favor espera
                un momento.</p>

            <!-- Progress Track -->
            <style>
                @keyframes avatarIdle {
                    0%, 100% { transform: translate(-50%, -50%) scale(1); }
                    50% { transform: translate(-50%, -52%) scale(1.05); }
                }
                @keyframes bossPulse {
                    0%, 100% { transform: translateY(-50%) scale(1); filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.2)); }
                    50% { transform: translateY(-50%) scale(1.1); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.6)); }
                }
                .avatar-anim { animation: avatarIdle 2.5s ease-in-out infinite; }
                .boss-anim { animation: bossPulse 3s ease-in-out infinite; }
            </style>

            <div id="module-progress-container" style="margin-bottom: 2rem; display: none;">
                <div class="progress-track" style="
                    height: 10px; 
                    background: rgba(30, 41, 59, 0.6); 
                    border-radius: 99px; 
                    position: relative; 
                    margin: 3rem 1.5rem 1.5rem;
                    border: 1px solid rgba(255,255,255,0.05);
                ">
                    <!-- Progress Fill -->
                    <div id="progress-fill" style="
                        height: 100%; 
                        width: 0%; 
                        background: linear-gradient(90deg, var(--forest-glow), #4ade80); 
                        border-radius: 99px;
                        transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
                        box-shadow: 0 0 15px var(--forest-glow);
                    "></div>
                    
                    <!-- Avatar Marker -->
                    <div id="avatar-marker" class="avatar-anim" style="
                        position: absolute; 
                        top: 50%; 
                        left: 0%; 
                        transform: translate(-50%, -50%); 
                        font-size: 2.2rem; 
                        transition: left 1s cubic-bezier(0.34, 1.56, 0.64, 1);
                        filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
                        z-index: 10;
                    ">🦊</div>

                    <!-- Boss Marker -->
                    <div class="boss-anim" style="
                        position: absolute; 
                        top: 50%; 
                        right: -15px; 
                        transform: translateY(-50%); 
                        font-size: 3rem;
                        z-index: 5;
                    " title="Guardián del Bosque">👹</div>
                </div>
            </div>

            <!-- The Peak Map (generado dinámicamente) -->
            <main class="peak-map" id="map-path"
                style="flex-direction: column; overflow-x: hidden; padding-top: 0; max-width: 600px; margin: 0 auto;">
                <!-- Contenido inyectado por JS -->
            </main>

        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/errorTracker.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/moduleLoader.js"></script>
</body>

</html>
